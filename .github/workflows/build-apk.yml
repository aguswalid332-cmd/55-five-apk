name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Active Java major version could not be detected."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Java 17+ environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Debug keystore verified successfully."

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected APK not found at $TARGET_APK"
            echo "Searching only inside app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: APK at $TARGET_APK is empty."
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension."; exit 1 ;;
          esac

          echo "APK successfully verified at $TARGET_APK."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$TEMP_DIR/app-debug.apk"
          echo "asset_dir=$TEMP_DIR" >> "$GITHUB_OUTPUT"
          echo "asset_path=$TEMP_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at $TEMP_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_FILE="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_FILE" ]; then
            echo "ERROR: Prepared release asset does not exist."
            exit 1
          fi

          if [ ! -s "$ASSET_FILE" ]; then
            echo "ERROR: Prepared release asset is empty."
            exit 1
          fi

          FILENAME=$(basename "$ASSET_FILE")
          if [ "$FILENAME" != "app-debug.apk" ]; then
            echo "ERROR: Asset filename is not exactly app-debug.apk"
            exit 1
          fi

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"

          BODY=$(cat <<EOF
          ### Automated Debug APK Build

          - **Build System:** GitHub Actions
          - **Run Number:** #${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** ${{ github.sha }}
          - **Status:** Automatically generated debug APK

          > **Notice:**
          > - This APK is intended for testing and debugging purposes.
          > - This is not a Google Play Store production release.
          > - This APK is signed with a temporary debug keystore.
          EOF
          )

          gh release create "$TAG" "$ASSET_FILE" \
            --title "$TITLE" \
            --notes "$BODY" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release successfully published!"
            gh release view "$TAG" || true
            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "APK Filename: app-debug.apk"

            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "[Download app-debug.apk]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Direct URL: \`$DIRECT_URL\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Backup Actions artifact \`app-debug-apk\` remains available." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publication did not succeed or was skipped."
            echo "The successfully compiled APK is preserved in the GitHub Actions backup artifact: app-debug-apk."
          fi
